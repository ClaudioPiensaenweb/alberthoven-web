services:

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx-global.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
    depends_on:
      - php
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.alberthoven.rule=Host(`alberthoven.com`) || Host(`www.alberthoven.com`)"
      - "traefik.http.routers.alberthoven.tls.certresolver=letsencrypt"
      - "traefik.http.services.alberthoven.loadbalancer.server.port=80"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.alberthoven-http.rule=Host(`alberthoven.com`) || Host(`www.alberthoven.com`)"
      - "traefik.http.routers.alberthoven-http.entrypoints=web"
      - "traefik.http.routers.alberthoven-http.middlewares=alberthoven-https@docker"
      - "traefik.http.middlewares.alberthoven-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.alberthoven-https.redirectscheme.permanent=true"
    networks:
      - dokploy-network
      - internal

  php:
    image: php:8.2-fpm-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - internal

networks:
  dokploy-network:
    external: true
    name: dokploy-network
  internal:
    driver: bridge
